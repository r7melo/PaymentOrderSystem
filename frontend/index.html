<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Sistema de Pagamentos (K3s)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .tab { overflow: hidden; border: 1px solid #ccc; background-color: #f1f1f1; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; font-size: 16px; transition: 0.3s; }
        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; font-weight: bold; }
        .tabcontent { display: none; padding: 20px; border: 1px solid #ccc; border-top: none; background: white; }
        .card { padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
        button.action-btn { padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button.action-btn:hover { background: #218838; }
        input[type="text"], input[type="number"] { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<h2>Sistema de Transações em Rede (K3s)</h2>

<div class="tab">
  <button class="tablinks active" onclick="openTab(event, 'PagadorTab')">Tela PAGADOR</button>
  <button class="tablinks" onclick="openTab(event, 'RecebedorTab')">Tela RECEBEDOR</button>
</div>

<!-- TELA PAGADOR -->
<div id="PagadorTab" class="tabcontent" style="display: block;">
    <h3>Painel do Pagador</h3>
    <div class="card">
        <h4>Saldo Atual (Contas): R$ <span id="saldo-pagador">0.00</span></h4>
        <button onclick="carregarSaldoPagador()">Atualizar Saldo</button>
    </div>

    <div class="card">
        <h4>Criar Ordem de Pagamento</h4>
        <label>Pagador: </label><br>
        <input type="text" id="pagador-id" value="PAGADOR_1" readonly><br><br>
        <label>Recebedor: </label><br>
        <input type="text" id="recebedor-id" value="RECEBEDOR_1"><br><br>
        <label>Valor (R$): </label><br>
        <input type="number" id="valor-id" value="50.00" step="0.01"><br><br>
        <button class="action-btn" onclick="criarOrdem()">CreateOrdem</button>
    </div>
</div>

<!-- TELA RECEBEDOR -->
<div id="RecebedorTab" class="tabcontent">
    <h3>Painel do Recebedor</h3>
    <div class="card">
        <h4>Saldo Atual (Contas): R$ <span id="saldo-recebedor">0.00</span></h4>
        <button onclick="carregarSaldoRecebedor()">Atualizar Saldo</button>
    </div>

    <div class="card">
        <h4>Ordens Recebidas para Confirmar</h4>
        <button onclick="carregarOrdensPendentes()">ListOrdens</button>
        <div id="lista-ordens" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    // Configuração dinâmica para conectar às portas NodePort do K3s
    const HOST = window.location.hostname;
    const ORDERS_URL = `http://${HOST}:30001`;
    const CONFIRM_URL = `http://${HOST}:30002`;
    const ACCOUNTS_URL = `http://${HOST}:30003`;

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
    }

    async function carregarSaldoPagador() {
        const user = document.getElementById('pagador-id').value;
        try {
            const res = await fetch(`${ACCOUNTS_URL}/contas/${user}`);
            const data = await res.json();
            document.getElementById('saldo-pagador').innerText = data.saldo.toFixed(2);
        } catch (e) {
            console.error('Erro ao buscar saldo do pagador:', e);
        }
    }

    async function carregarSaldoRecebedor() {
        const user = document.getElementById('recebedor-id').value;
        try {
            const res = await fetch(`${ACCOUNTS_URL}/contas/${user}`);
            const data = await res.json();
            document.getElementById('saldo-recebedor').innerText = data.saldo.toFixed(2);
        } catch (e) {
            console.error('Erro ao buscar saldo do recebedor:', e);
        }
    }

    async function criarOrdem() {
        const body = {
            pagador: document.getElementById('pagador-id').value,
            recebedor: document.getElementById('recebedor-id').value,
            valor: parseFloat(document.getElementById('valor-id').value)
        };
        try {
            const res = await fetch(`${ORDERS_URL}/ordens`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if(res.ok) {
                alert('Ordem Criada e enviada via RabbitMQ!');
                carregarSaldoPagador();
            } else {
                const err = await res.json();
                alert('Erro ao criar ordem: ' + (err.detail || 'Falha na validação'));
            }
        } catch (e) {
            alert('Erro de comunicação com o serviço de ordens');
            console.error(e);
        }
    }

    async function carregarOrdensPendentes() {
        try {
            const res = await fetch(`${CONFIRM_URL}/confirmacoes`);
            const data = await res.json();
            const container = document.getElementById('lista-ordens');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<p>Nenhuma ordem pendente.</p>';
                return;
            }

            data.forEach(item => {
                container.innerHTML += `
                    <div style="border:1px solid #ccc; padding:10px; margin-top:8px; background:#fff; border-radius:4px;">
                        <p><strong>ID:</strong> ${item.id} | <strong>De:</strong> ${item.pagador} | <strong>Para:</strong> ${item.recebedor} | <strong>Valor:</strong> R$ ${parseFloat(item.valor).toFixed(2)} | <strong>Status:</strong> ${item.status}</p>
                        ${item.status !== 'CONFIRMADA' ? `<button class="action-btn" onclick="confirmarOrdem('${item.id}')">ConfirmeOrdem</button>` : '<span style="color:green; font-weight:bold;">✔ Confirmada</span>'}
                    </div>
                `;
            });
        } catch (e) {
            console.error('Erro ao carregar ordens:', e);
        }
    }

    async function confirmarOrdem(id) {
        try {
            const res = await fetch(`${CONFIRM_URL}/confirmacoes/${id}/confirmar`, { method: 'POST' });
            if(res.ok) {
                alert('Ordem confirmada! O saldo foi atualizado.');
                carregarOrdensPendentes();
                carregarSaldoRecebedor();
            } else {
                const err = await res.json();
                alert('Erro ao confirmar ordem: ' + (err.detail || 'Falha na confirmação'));
            }
        } catch (e) {
            alert('Erro de comunicação com o serviço de confirmação');
            console.error(e);
        }
    }

    // Carregamento inicial de saldos
    carregarSaldoPagador();
    carregarSaldoRecebedor();
</script>

</body>
</html>

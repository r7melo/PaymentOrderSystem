<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PaymentOrderSystem{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <script>
    window.APP_CONFIG = {
      API_BASE_URL: "{{ public_api_url }}"
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <nav class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
    <span class="font-bold text-lg">PaymentOrderSystem</span>
    {% if show_logout %}
    <button id="logout-btn" class="bg-slate-600 hover:bg-slate-500 px-3 py-1 rounded">
      Sair
    </button>
    {% endif %}
  </nav>

  <main class="flex-1 container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

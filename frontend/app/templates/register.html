{% extends "base.html" %}

{% block title %}Cadastro - PaymentOrderSystem{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8">
  <h1 class="text-2xl font-bold mb-6 text-center">Criar conta</h1>

  <form id="register-form" class="flex flex-col gap-4">
    <div>
      <label for="name" class="block text-sm font-medium mb-1">Nome</label>
      <input type="text" id="name" required
        class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium mb-1">Email</label>
      <input type="email" id="email" required
        class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium mb-1">Senha</label>
      <input type="password" id="password" required
        class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label for="confirm-password" class="block text-sm font-medium mb-1">
        Confirmar senha
      </label>
      <input type="password" id="confirm-password" required
        class="w-full border rounded px-3 py-2" />
    </div>

    <button type="submit"
      class="bg-slate-800 text-white rounded py-2 hover:bg-slate-700">
      Cadastrar
    </button>
  </form>

  <p class="text-center text-sm mt-4">
    Já tem conta?
    <a href="/login" class="text-slate-800 font-medium underline">Entrar</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}

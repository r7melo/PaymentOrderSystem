services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  accounts_service:
    build: ./accounts_service
    container_name: accounts_service
    ports: ["30003:8003"]
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes: ["./accounts_service:/app"]
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload

  orders_service:
    build: ./orders_service
    container_name: orders_service
    ports: ["30001:8001"]
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes: ["./orders_service:/app"]
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  confirmation_service:
    build: ./confirmation_service
    container_name: confirmation_service
    ports: ["30002:8002"]
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes: ["./confirmation_service:/app"]
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  frontend:
    build: ./frontend
    volumes: ["./frontend/index.html:/usr/share/nginx/html/index.html:ro"]
    container_name: frontend
    ports: ["30080:80"]
    depends_on:
      - orders_service
      - confirmation_service
      - accounts_service

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
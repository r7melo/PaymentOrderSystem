apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-service
  template:
    metadata:
      labels:
        app: accounts-service
    spec:
      containers:
      - name: accounts-service
        image: accounts-service:latest
        imagePullPolicy: Never
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        ports:
        - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-service
spec:
  type: NodePort
  selector:
    app: accounts-service
  ports:
  - port: 8003
    targetPort: 8003
    nodePort: 30003
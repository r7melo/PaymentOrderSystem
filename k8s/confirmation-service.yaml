apiVersion: apps/v1
kind: Deployment
metadata:
  name: confirmation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confirmation-service
  template:
    metadata:
      labels:
        app: confirmation-service
    spec:
      containers:
      - name: confirmation-service
        image: confirmation-service:latest
        imagePullPolicy: Never
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        ports:
        - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: confirmation-service
spec:
  type: NodePort
  selector:
    app: confirmation-service
  ports:
  - port: 8002
    targetPort: 8002
    nodePort: 30002
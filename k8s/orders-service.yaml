apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
      - name: orders-service
        image: orders-service:latest
        imagePullPolicy: Never
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: DB_HOST
          value: "orders-db"
        - name: DB_NAME
          value: "orders"
        - name: DB_USER
          value: "orders"
        - name: DB_PASSWORD
          value: "orders"
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
spec:
  type: NodePort
  selector:
    app: orders-service
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30001